name = "pkghaus-reproducible"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# The whole host. Nothing else claims a pattern here.
#
# The analytics proxy is the exception, and it needs its own pin:
# reproducible.pkg.haus/* is 23 characters and *pkg.haus/zk/* is 14, so this
# route wins /zk/ and answers it with this Worker's 404. pkghaus/plausible-
# worker carries `reproducible.pkg.haus/zk/*` for that reason, the same pin
# apt.pkg.haus and buildinfos.pkg.haus already have. Without it the page's
# script tag 404s and analytics are silently dark.
#
# The other half of that wiring is an entry in plausible-worker's PLAUSIBLE
# map, which needs a site created in the Plausible dashboard and cannot be
# written from here. Until it exists the route is live and the Worker logs
# "PLAUSIBLE has no script for host reproducible.pkg.haus" -- visible, which
# is the point of adding the route first.
#
# Leave the failure mode at Cloudflare's default, fail CLOSED. There is nothing
# to fall open TO: every pkg.haus host is AAAA 100::, the discard prefix, so a
# bypassed request hangs for thirty seconds and ends in 504, where fail closed
# errors immediately and a client can retry.
#
# No wrangler field for it. The flag is on the route object, set with
# PUT /zones/<id>/workers/routes/<route-id>, which carries the WHOLE object --
# send pattern and script too or the route is reassigned.
routes = [
  { pattern = "reproducible.pkg.haus/*", zone_name = "pkg.haus" },
]

# The verdicts, and nothing else. A SEPARATE bucket from the archive's
# pkghaus-apt, and the reason is prefix scoping, not taste.
#
# buildinfos.pkg.haus DOES share pkghaus-apt, and that is consistent: it only
# reads. It holds no R2 credentials, and its Worker never calls put() -- the
# binding is the whole of its access. This Worker is the same, a pure reader.
#
# What differs is the WRITER. Verdicts are uploaded by this repo's CI over the
# S3 API, and R2 API tokens scope to whole buckets with no prefix or path
# condition (checked against Cloudflare's token docs 2026-09-21). A token
# letting CI write `verify/` under pkghaus-apt would equally let it write
# `pool/` and `dists/`: every .deb and every signed index. The job holding it
# runs debrebuild under --privileged, executing upstream build scripts, six
# legs a day.
#
# Separate buckets mean a compromised verifier can lie in a verdict and
# nothing more; the archive's own hashes still hold. One bucket would let it
# rewrite the artifact AND publish GOOD for it, which is the estate's first
# rule - a check that shares state with its subject cannot detect the defect.
[[r2_buckets]]
binding = "VERDICTS"
bucket_name = "pkghaus-reproducible"

# No [assets] block on purpose. Every page here is rendered from the bucket's
# contents, so there is no tree to keep in sync and no deploy that can silently
# publish an empty site. Same reasoning as buildinfos.
#
# The cost is that the branded 404.html every other host serves from its asset
# layer has to be rendered here instead, which errorPage() does.

[observability]
enabled = true
head_sampling_rate = 1
