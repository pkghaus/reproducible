version: 2

updates:
  # Every action here is first-party actions/* on a major tag, which this
  # bumps. The shellcheck and actionlint images are pinned by digest in run:
  # lines, which Dependabot never reads, so those move by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # wrangler is pinned exactly and runs with a token that can deploy a worker
  # on a pkg.haus host. Pinning stops it changing on its own; this stops it
  # going stale. The directory is /worker, not /: package.json lives beside the
  # worker, and a config pointing at the root finds nothing and reports
  # nothing, so the gap reads exactly like coverage.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
