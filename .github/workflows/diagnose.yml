name: Diagnose

# Names the functions a non-deterministic build disagrees with itself about.
#
# It builds one record TWICE with symbols kept and diffs the two against each
# other. Every binary the archive ships is stripped, so an offset in .text
# resolves to nothing, and the obvious fix -- one build with symbols, mapped
# against the published one -- does not work: measured 2026-09-21 on
# zola/arm64, keeping symbols made .text 19,456 bytes longer, so the offset
# pointed at different code and the symbol it produced had to be withdrawn.
#
# Two builds in one configuration share a layout by construction, so a
# differing byte maps to a symbol in the same build family and nothing has to
# be assumed about the published binary.
#
# A pair can come back identical; on a package that fails about half the time
# that is the expected outcome about half of all runs, and it is reported as a
# result rather than an error.
#
# Manual by design. It is a diagnostic, it writes nothing to the bucket, and
# the run it produces must never be published -- DEB_BUILD_OPTIONS is recorded
# in .buildinfo, so a nostrip build is self-identifying and wrong to ship.

on:
  workflow_dispatch:
    inputs:
      buildinfo_url:
        description: >
          Full URL of the record to rebuild, as the verdict JSON publishes it,
          e.g. https://buildinfos.pkg.haus/buildinfo-pool/z/zola/zola_0.23.6-3_arm64.buildinfo
        type: string
        required: true
      arch:
        description: >
          Which runner to build on. It must match the record's architecture:
          the point is to reproduce that build's code layout, and cross-arch
          would reproduce nothing.
        type: choice
        options: [arm64, amd64]
        default: arm64

permissions:
  contents: read

# One at a time. Each run is a full package build against snapshot.debian.org,
# which is the same rationed service the verifier throttles itself against, and
# two diagnostics racing would spend that budget to learn one fact.
concurrency:
  group: diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: diagnose / ${{ inputs.arch }}
    # Native, never QEMU, for the same reason the verify legs are: debrebuild
    # installs the record's exact build dependencies and runs a real build,
    # which under emulation takes hours. The non-empty branch has to be in the
    # middle -- in a GitHub expression `a && b || c` yields c whenever b is
    # falsy, so the obvious spelling would put every run on one runner.
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # TWO full Rust builds, serially, plus dependency resolution from a
    # rate-limited mirror.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every expression through env:, none inside the run: block.
      - name: Build twice with symbols and diff them
        env:
          IN_URL: ${{ inputs.buildinfo_url }}
        run: scripts/diagnose.sh "$IN_URL" out

      - name: Show the report in the summary
        if: always()
        run: |
          if [ -f out/report.txt ]; then
            {
              echo '```'
              cat out/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # always(), because a run that got far enough to produce an unstripped
      # binary and then failed the diff still did the expensive half.
      - name: Upload the unstripped binary and symbol map
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnose-${{ inputs.arch }}
          path: out/
          # error, not ignore: this workflow exists to produce these files, so
          # an empty directory means it did nothing and should say so. The
          # opposite of the evidence upload in verify.yml, where most legs
          # legitimately have nothing to keep.
          if-no-files-found: error
